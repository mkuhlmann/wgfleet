services:
  wgfleet:
    image: ghcr.io/mkuhlmann/wgfleet:latest
    container_name: wgfleet
    environment:
      - ADMIN_TOKEN=CHANGE_ME
    volumes:
      - ./wg-data:/app/data
    ports:
      - 3000:3000
      # one per wireguard server you run
      - 51820:51820/udp
      # one per *peer* exit node - each gets its own wg interface on its own udp port
      # from 51900 upwards. Not needed if you only use the server's own exit.
      - 51900-51909:51900-51909/udp
    cap_add:
      - SYS_MODULE
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
